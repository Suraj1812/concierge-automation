version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/server.js
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/worker.js
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
